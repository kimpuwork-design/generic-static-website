<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create account — OG Provider Clone</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .auth { max-width: 460px; margin: 0 auto; }
    .auth-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 1rem; }
    .auth-logo { display: block; margin: 0 auto 0.6rem auto; height: 36px; }
    .auth a { text-decoration: none; }
    .field { display: grid; gap: 0.35rem; margin-bottom: 0.7rem; }
    .input { padding: 0.6rem 0.7rem; border-radius: 10px; border: 1px solid #e5e7eb; font-size: 1rem; }
    .oauth { display: flex; justify-content: center; margin-bottom: 0.6rem; }
    .oauth a { display:inline-flex; align-items:center; gap:0.5rem; background:#111827; color:#fff; border-radius:10px; padding:0.5rem 0.8rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <a href="/"><img class="brand-logo" src="https://cs1.socpanel.com/cs1/panel_logos/2LZexkl6PJSuDMiYkBEQHj1HLoQhCckfctYMEzVr.png" alt="OG Provider" /></a>
      </div>
      <nav class="nav">
        <a class="btn btn--ghost" href="/">Home</a>
        <a class="btn btn--primary" href="/order">Fast order</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth">
      <div class="oauth">
        <a href="#"><img src="https://www.google.com/favicon.ico" alt="" width="16" height="16"> Google</a>
      </div>
      <div class="auth-card">
        <a href="/"><img class="auth-logo" src="https://cs1.socpanel.com/cs1/panel_logos/2LZexkl6PJSuDMiYkBEQHj1HLoQhCckfctYMEzVr.png" alt=""></a>
        <form>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" class="input" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" class="input" type="text" placeholder="yourname" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" class="input" type="password" placeholder="••••••••" required />
          </div>
          <div class="field">
            <label for="phone">phone</label>
            <input id="phone" class="input" type="tel" placeholder="+60 12 345 6789" />
          </div>
          <button class="btn btn--primary" type="submit" style="width:100%;">Create account</button>
        </form>
        <p style="text-align:center; margin-top:0.6rem;">Already have an account? <a href="/login">Sign in</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>Unofficial clone for demonstration purposes. All trademarks and images belong to their respective owners.</p>
  </footer>
  <script src="assets/script.js"></script>
</body>
</html>
