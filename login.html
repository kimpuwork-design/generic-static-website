<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in — OG Provider Clone</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .auth { max-width: 420px; margin: 0 auto; }
    .auth-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 1rem; }
    .auth-logo { display: block; margin: 0 auto 0.6rem auto; height: 36px; }
    .auth a { text-decoration: none; }
    .field { display: grid; gap: 0.35rem; margin-bottom: 0.7rem; }
    .input { padding: 0.6rem 0.7rem; border-radius: 10px; border: 1px solid #e5e7eb; font-size: 1rem; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .row a { color: #3b82f6; font-size: 0.9rem; }
    .oauth { display: flex; justify-content: center; margin-bottom: 0.6rem; }
    .oauth a { display:inline-flex; align-items:center; gap:0.5rem; background:#111827; color:#fff; border-radius:10px; padding:0.5rem 0.8rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <a href="/"><img class="brand-logo" src="https://cs1.socpanel.com/cs1/panel_logos/2LZexkl6PJSuDMiYkBEQHj1HLoQhCckfctYMEzVr.png" alt="OG Provider" /></a>
      </div>
      <nav class="nav">
        <a class="btn btn--ghost" href="/">Home</a>
        <a class="btn btn--primary" href="/order">Fast order</a>
        <a class="btn btn--ghost" href="/reg">Start Now</a>
        <a id="linkSignIn" class="btn btn--ghost" href="/login" style="display:none;">Sign in</a>
        <a id="linkAccount" class="btn btn--ghost" href="/order" style="display:none;">Account</a>
        <a class="btn btn--ghost cart-link" href="/cart.html">Cart <span id="cartCount" class="badge">0</span></a>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth">
      <div class="oauth">
        <a href="#"><img src="https://www.google.com/favicon.ico" alt="" width="16" height="16"> Google</a>
      </div>
      <div class="auth-card">
        <a href="/"><img class="auth-logo" src="https://cs1.socpanel.com/cs1/panel_logos/2LZexkl6PJSuDMiYkBEQHj1HLoQhCckfctYMEzVr.png" alt=""></a>
        <form>
          <div class="field">
            <label for="login">Login or email</label>
            <input id="login" class="input" type="text" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <div class="row">
              <label for="password">Password</label>
              <a href="#">Forgot?</a>
            </div>
            <input id="password" class="input" type="password" placeholder="••••••••" required />
          </div>
          <button class="btn btn--primary" type="submit" style="width:100%;">Sign in</button>
        </form>
        <p style="text-align:center; margin-top:0.6rem;">No account? <a href="/reg">Create account</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>Unofficial clone for demonstration purposes. All trademarks and images belong to their respective owners.</p>
  </footer>
  <script src="assets/script.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
